name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"   # 最低支持版本，保证兼容

      - name: 凭据扫描（红线：公开仓不得含真实 IP/密码/token）
        run: python tests/check_secrets.py

      - name: Python 语法
        run: python -m py_compile scripts/oc.py tests/*.py && echo "OK"

      - name: CLI 可运行
        run: |
          python scripts/oc.py --help >/dev/null
          python scripts/oc.py doctor || true   # 未配置属预期

      - name: 退出码语义（不需真实路由器）
        run: |
          set +e
          fail=0
          check() { desc="$1"; want="$2"; shift 2
            "$@" >/dev/null 2>&1; got=$?
            if [ "$got" != "$want" ]; then
              echo "::error::$desc: 期望 $want 实际 $got"; fail=1
            else echo "OK  $desc (exit=$got)"; fi
          }
          check "run 空命令"           2 python scripts/oc.py run ""
          check "push 本地文件不存在"   9 python scripts/oc.py push /nonexistent-xyz /root/x
          check "OC_CONFIG 指向不存在"  5 env OC_CONFIG=/tmp/nope.json python scripts/oc.py doctor
          rm -f /tmp/nope.json
          exit $fail
